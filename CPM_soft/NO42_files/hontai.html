<p class="i">
<font color="blue">
Z80,
8085,
6809,
8048,
8051,
630X,
64180
</font>
に対応した組み込み用途のリロケタブルマクロクロスアセンブラです。
<font color="blue">8080/8085</font>
や
<font color="blue">Z80</font>
の場合ではマイクロソフトの
<font color="blue">M80</font>
形式のアセンブリ言語が入力できます。
グローバルシンボル名の長さの制約から
<font color="blue">M80/L80</font>
が使えない場合に重宝します。
リンカは
<font color="blue">COM</font>
形式のファイルを出力できますのでCP/Mプログラムの開発にも使用できます。
</p>
